<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCI Proxy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grain" aria-hidden="true"></div>

    <main class="console">
        <header class="masthead">
            <h1 class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">oci<span class="brand-sep">/</span>proxy</span>
            </h1>
            <div class="status" id="status" data-state="pending">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="status-text" data-i18n="statusPending">checking</span>
            </div>
        </header>

        <p class="tagline" data-i18n="subtitle">Pull images through the proxy.</p>

        <div class="runtimes" role="radiogroup" data-i18n-aria-label="selectRuntime">
            <input type="radio" id="runtime-docker" name="runtime" value="docker" checked>
            <label for="runtime-docker">docker</label>
            <input type="radio" id="runtime-podman" name="runtime" value="podman">
            <label for="runtime-podman">podman</label>
            <input type="radio" id="runtime-nerdctl" name="runtime" value="nerdctl">
            <label for="runtime-nerdctl">nerdctl</label>
        </div>

        <div class="prompt" id="prompt">
            <span class="prompt-sigil" aria-hidden="true">$</span>
            <span class="prompt-verb" aria-hidden="true"><span id="prompt-runtime">docker</span> pull</span>
            <span class="prompt-field">
                <input type="text" id="proxy-address" class="prompt-host" spellcheck="false"
                       autocapitalize="off" autocorrect="off"
                       data-i18n-placeholder="proxyPlaceholder" data-i18n-title="proxyHint"
                       data-i18n-aria-label="proxyHint">
                <span class="prompt-slash" aria-hidden="true">/</span>
                <input type="text" id="image" class="prompt-image" spellcheck="false"
                       autocapitalize="off" autocorrect="off" autofocus
                       data-i18n-placeholder="imagePlaceholder" data-i18n-aria-label="imageAddress">
            </span>
        </div>

        <p class="hint" data-i18n="imageExample">Paste a whole pull command if you like.</p>

        <section class="output" id="output" data-empty="true">
            <div class="output-bar">
                <span class="output-label" data-i18n="generated">generated</span>
                <button class="copy" id="copy-btn" data-i18n-title="copy" disabled>
                    <svg class="copy-icon icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="9" width="12" height="12" rx="2"></rect>
                        <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
                    </svg>
                    <svg class="copy-icon icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 13l5 5L20 7"></path>
                    </svg>
                    <span class="copy-label" id="copy-label" data-i18n="copy">copy</span>
                </button>
            </div>
            <pre id="command-text" data-i18n="waitingInput">Waiting for an image name.</pre>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
